<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" width="1060" height="780" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">

  <title>Graf zależności roadmapy MySmaug — stan 2026-07-28</title>

  <defs>
    <marker id="strzalka" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <style>
      .box       { stroke-width: 2; }
      .zrobione  { fill: #1b5e20; stroke: #0d3010; }
      .dowziecia { fill: #0d47a1; stroke: #05295c; }
      .zablok    { fill: #4a4a4a; stroke: #262626; }
      .id        { fill: #ffffff; font-size: 17px; font-weight: 600; }
      .opis      { fill: #e6e6e6; font-size: 13px; }
      .linia     { stroke: #8a8a8a; stroke-width: 2; fill: none;
                   stroke-linejoin: miter; }
      .kraw      { stroke: #8a8a8a; stroke-width: 2; fill: none;
                   stroke-linejoin: miter; marker-end: url(#strzalka); }
      .tytul     { fill: #9a9a9a; font-size: 13px; }
      .legenda   { fill: #9a9a9a; font-size: 13px; }
    </style>
  </defs>

  <!-- ============ KRAWĘDZIE — routing ortogonalny, rysowane pod ramkami ============ -->

  <!-- magistrala 1: F-01, F-02, F-03, F-05  ->  S-01 -->
  <path class="linia" d="M 105 86 L 105 128"/>
  <path class="linia" d="M 275 86 L 275 128"/>
  <path class="linia" d="M 415 86 L 415 128"/>
  <path class="linia" d="M 585 86 L 585 128"/>
  <path class="linia" d="M 105 128 L 585 128"/>
  <path class="kraw"  d="M 445 128 L 445 170"/>

  <!-- magistrala 2: F-03, F-05  ->  S-07 (drugie wyjścia z tych samych ramek) -->
  <path class="linia" d="M 475 86 L 475 150"/>
  <path class="linia" d="M 645 86 L 645 150"/>
  <path class="linia" d="M 475 150 L 775 150"/>
  <path class="kraw"  d="M 775 150 L 775 170"/>

  <!-- F-04 -> S-10 (wchodzi prawym bokiem: górna krawędź zajęta przez S-01) -->
  <path class="kraw" d="M 955 86 L 955 338 L 860 338"/>

  <!-- magistrala 3: S-01 -> warstwa 2 -->
  <path class="linia" d="M 445 226 L 445 270"/>
  <path class="linia" d="M 105 270 L 785 270"/>
  <path class="kraw"  d="M 105 270 L 105 310"/>
  <path class="kraw"  d="M 275 270 L 275 310"/>
  <path class="kraw"  d="M 445 270 L 445 310"/>
  <path class="kraw"  d="M 615 270 L 615 310"/>
  <path class="kraw"  d="M 785 270 L 785 310"/>

  <!-- S-07 -> S-09: kanałem po prawej, bo pod S-07 stoi S-10 -->
  <path class="kraw" d="M 775 226 L 775 250 L 980 250 L 980 618 L 520 618"/>

  <!-- magistrala 4: S-02 -> S-05, S-06, S-09 -->
  <path class="linia" d="M 105 366 L 105 550"/>
  <path class="linia" d="M 105 550 L 445 550"/>
  <path class="kraw"  d="M 105 550 L 105 590"/>
  <path class="kraw"  d="M 275 550 L 275 590"/>
  <path class="kraw"  d="M 445 550 L 445 590"/>

