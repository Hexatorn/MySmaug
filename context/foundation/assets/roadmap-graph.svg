  <rect class="box zablok" x="30"  y="310" width="150" height="56" rx="6"/>
  <text class="id"   x="105" y="334" text-anchor="middle">S-02</text>
  <text class="opis" x="105" y="353" text-anchor="middle">lista miesiąca</text>

  <rect class="box zablok" x="200" y="310" width="150" height="56" rx="6"/>
  <text class="id"   x="275" y="334" text-anchor="middle">S-03</text>
  <text class="opis" x="275" y="353" text-anchor="middle">suma miesięczna</text>

  <rect class="box zablok" x="370" y="310" width="150" height="56" rx="6"/>
  <text class="id"   x="445" y="334" text-anchor="middle">S-08</text>
  <text class="opis" x="445" y="353" text-anchor="middle">beneficjenci</text>

  <rect class="box zablok" x="540" y="310" width="150" height="56" rx="6"/>
  <text class="id"   x="615" y="334" text-anchor="middle">S-12</text>
  <text class="opis" x="615" y="353" text-anchor="middle">ustawienia bazy</text>

  <rect class="box zablok" x="710" y="310" width="150" height="56" rx="6"/>
  <text class="id"   x="785" y="334" text-anchor="middle">S-10</text>
  <text class="opis" x="785" y="353" text-anchor="middle">onboarding</text>

  <!-- ================= WARSTWA 3 ================= -->

  <rect class="box zablok" x="200" y="450" width="150" height="56" rx="6"/>
  <text class="id"   x="275" y="474" text-anchor="middle">S-04</text>
  <text class="opis" x="275" y="493" text-anchor="middle">suma roczna</text>

  <rect class="box zablok" x="710" y="450" width="150" height="56" rx="6"/>
  <text class="id"   x="785" y="474" text-anchor="middle">S-11</text>
  <text class="opis" x="785" y="493" text-anchor="middle">zmiana profilu</text>

  <!-- ================= WARSTWA 4 ================= -->

  <rect class="box zablok" x="30"  y="590" width="150" height="56" rx="6"/>
  <text class="id"   x="105" y="614" text-anchor="middle">S-05</text>
  <text class="opis" x="105" y="633" text-anchor="middle">edycja transakcji</text>

  <rect class="box zablok" x="200" y="590" width="150" height="56" rx="6"/>
  <text class="id"   x="275" y="614" text-anchor="middle">S-06</text>
  <text class="opis" x="275" y="633" text-anchor="middle">soft-delete</text>

  <rect class="box zablok" x="370" y="590" width="150" height="56" rx="6"/>
  <text class="id"   x="445" y="614" text-anchor="middle">S-09</text>
  <text class="opis" x="445" y="633" text-anchor="middle">filtr listy</text>

  <!-- ================= LEGENDA ================= -->

  <rect class="box zrobione"  x="30"  y="700" width="26" height="20" rx="4"/>
  <text class="legenda" x="66"  y="715">zrealizowane (F-01, F-05)</text>

  <rect class="box dowziecia" x="250" y="700" width="26" height="20" rx="4"/>
  <text class="legenda" x="286" y="715">do wzięcia teraz — wszystkie wymagania spełnione (F-02, F-03, F-04)</text>

  <rect class="box zablok"    x="710" y="700" width="26" height="20" rx="4"/>
  <text class="legenda" x="746" y="715">zablokowane — brak wymagania (cała reszta)</text>

  <text class="tytul" x="30" y="750">Strzałka biegnie od wymagania do tego, co ono odblokowuje. Rysunek po redukcji przechodniej: krawędź wynikająca z innej ścieżki nie jest rysowana.</text>
  <text class="tytul" x="30" y="770">Stan odwzorowany 2026-07-28. Źródło prawdy: pola Prerequisites i Status w context/foundation/roadmap.md.</text>

</svg>
